:root{--badge:#C62828;--onbadge:#fff}

.dcol{gap:14px}

    const text=await file.text(),list=parseList(text);
    S[side]=list;S['name'+side]=file.name;S.err[side]='';S.removed.clear();S.groups=[];S.queue=[];S.hist=[];S.reach=1;

  }catch(e){S[side]=[];S.err[side]=e.message;S.groups=[];S.queue=[];S.reach=1}

function download(){

    bitwarden:{h:['folder','favorite','type','name','notes','fields','reprompt','login_uri','login_username','login_password','login_totp'],r:e=>['',0,'login',T(e),e.note,'',0,bwUri(e.url),e.username,e.password,e.otp]},
    zen:{h:['url','username','password'],r:e=>[e.url,e.username,e.password]},
    keepass:{h:['Group','Title','Username','Password','URL','Notes','TOTP'],r:e=>['',T(e),e.username,e.password,e.url,e.note,e.otp]},
    apple:{h:['Title','URL','Username','Password','Notes','OTPAuth'],r:e=>[T(e),e.url,e.username,e.password,e.note,e.otp]},
    chrome:{h:['name','url','username','password','note'],r:e=>[T(e),e.url,e.username,e.password,e.note]}
  }[S.fmt];
  const rows=[F.h];for(const e of output())rows.push(F.r(S.tagsrc&&e.src?{...e,note:(e.note&&!e.note.includes(e.src)?e.note+'\n':'')+(e.note&&e.note.includes(e.src)?e.note:e.src)}:e));

const csvSafe=v=>{v=String(v??'');return /^[=+\-@]/.test(v)?"'"+v:v};

  for(const g of S.queue)rows.push([g.site,g.user,visitUrl(g),g.decided?(g.d==='remove'?'Left out':'Checked'):'To check',g.cands.length,g.cands.some(c=>!c.date)?'At least one version has no saved date':'']);
  const blob=new Blob([rows.map(r=>r.map(v=>csvq(csvSafe(v))).join(',')).join('\r\n')],{type:'text/csv'});
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='sites-to-check.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);

async function copyText(text){

  try{await navigator.clipboard.writeText(e.password);ok=true}catch(x){
    try{const ta=document.createElement('textarea');ta.value=e.password;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(y){}

const b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const ITER=600000;
async function deriveKey(pass,salt,usage,iter){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,usage);
}
async function encryptJSON(obj,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pass,salt,['encrypt'],ITER);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  return {app:'password-merger-progress',v:1,kdf:'PBKDF2-SHA256',iter:ITER,salt:b64(salt),iv:b64(iv),data:b64(ct)};
}
async function decryptJSON(f,pass){
  const key=await deriveKey(pass,unb64(f.salt),['decrypt'],Math.min(Math.max(+f.iter||ITER,1000),2000000));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(f.iv)},key,unb64(f.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

function restore(p){
  const okE=e=>e&&Number.isFinite(e.id)&&['url','username','password'].every(k=>typeof e[k]==='string');
  const pc=Array.isArray(p&&p.C)?p.C:[];
  if(!p||p.v!==1||!Array.isArray(p.A)||!Array.isArray(p.B)||!p.A.every(okE)||!p.B.every(okE)||!pc.every(okE))throw new Error('bad');
  const clean=e=>({id:e.id,name:String(e.name||''),url:e.url,username:e.username,password:e.password,note:String(e.note||''),otp:String(e.otp||''),date:Number.isFinite(e.date)?e.date:null,key:host(e.url)+'|'+e.username.trim().toLowerCase()});
  S=fresh();S.A=p.A.map(clean);S.B=p.B.map(clean);S.C=pc.map(clean);S.cTyped=!!p.cTyped&&S.C.length>0;S.third=S.C.length>0;
  S.nameA=String(p.nameA||'');S.nameB=String(p.nameB||'');S.nameC=String(p.nameC||'');
  S.labelA=String(p.labelA||'').slice(0,24);S.labelB=String(p.labelB||'').slice(0,24);S.labelC=String(p.labelC||'').slice(0,24);
  S.removed=new Set((p.removed||[]).filter(Number.isFinite));
  for(const m of (Array.isArray(p.manual)?p.manual:[]))if(okE(m)){const c=clean(m);c.manual=true;c.date=Number.isFinite(m.date)?m.date:Date.now();S.manual.set(c.key,c)}
  uid=Math.max(uid,[...allE(),...S.manual.values()].reduce((m,e)=>Math.max(m,e.id),0));
  if(typeof p.tagsrc==='boolean')S.tagsrc=p.tagsrc;
  if(['bitwarden','keepass','apple','zen','chrome'].includes(p.fmt))S.fmt=p.fmt;
  const dec=(p.decisions||[]).filter(x=>x&&typeof x.k==='string').map(x=>[x.k,{d:['pick','all','remove','keep'].includes(x.d)?x.d:'keep',decided:!!x.decided,pw:typeof x.pw==='string'?x.pw:''}]);
  S.groups=[];build(new Map(dec));
  S.view='main';S.focus=true;setStep(2);S.show=S.queue.length?'conf':'all';S.page=0;
}

  const t=e.target;
  if(t.id==='hex'){const v=hex2lch(t.value.trim());if(v){cur[role]=v;curName='Custom';applyTheme();customUI()}}
  else if(['nL','nC','nH'].includes(t.id)){const v=parseFloat(t.value);if(Number.isFinite(v)){cur[role]['LCH'.indexOf(t.id[1])]=v;curName='Custom';applyTheme();customUI()}}
  else if(t.id==='pfile'&&t.files[0]){
    try{
      const j=JSON.parse(await t.files[0].text());
      const ok=c=>c&&ROLES.every(([k])=>Array.isArray(c[k])&&c[k].length===3&&c[k].every(Number.isFinite));
      let n=0;for(const p of(j.presets||[]))if(p&&typeof p.name==='string'&&ok(p.colors)){presets.push({name:p.name.slice(0,30),colors:p.colors});n++}
      if(ok(j.current)&&!n){cur=j.current;curName='Imported';applyTheme()}
      persist();customUI();
    }catch(x){alert('That file is not a valid looks file.')}
  }
});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#custom').hidden)closeCustom();else closeDrawer()}});
try{
  const raw=localStorage.getItem(KEY);
  if(raw){const j=JSON.parse(raw);if(j&&j.cur){cur=j.cur;curName=j.curName||'Custom';presets=Array.isArray(j.presets)?j.presets:[];remember=true;applyTheme()}}
}catch(e){}
applyTheme();
render();
})();
</script>
</body>
</html>
